<svg xmlns="http://www.w3.org/2000/svg" width="3800" height="1500" viewBox="0 0 3800 1500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 38px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px Arial, sans-serif; fill: #475569; }
      .lane { font: 700 20px Arial, sans-serif; fill: #1d4ed8; }
      .boxTitle { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .boxText { font: 500 14px Arial, sans-serif; fill: #475569; }
      .decisionText { font: 700 18px Arial, sans-serif; fill: #92400e; }
      .edge { stroke: #64748b; stroke-width: 3.5; fill: none; marker-end: url(#arrow); }
      .edgeLabel { font: 600 14px Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="3800" height="1500" fill="url(#bg)"/>
  <text x="90" y="80" class="title">User Frontend Flow</text>
  <text x="90" y="115" class="subtitle">Standalone slide asset • frontend-user • exact flow preserved</text>

  <rect x="70" y="150" width="3660" height="250" rx="26" fill="#ffffff" stroke="#dbeafe"/>
