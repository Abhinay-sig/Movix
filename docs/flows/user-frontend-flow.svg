<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="1500" viewBox="0 0 2800 1500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b86"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px Arial, sans-serif; fill: #475569; }
      .lane-title { font: 700 18px Arial, sans-serif; fill: #1e3a8a; }
      .box-title { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 500 13px Arial, sans-serif; fill: #334155; }
      .decision-text { font: 700 16px Arial, sans-serif; fill: #7c2d12; }
      .link { stroke: #5b6b86; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .label { font: 600 13px Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="2800" height="1500" fill="url(#bg)"/>
  <text x="90" y="80" class="title">User Frontend Flow</text>
  <text x="90" y="112" class="subtitle">frontend-user • presentation-ready left-to-right project flow</text>

  <rect x="70" y="145" width="2660" height="300" rx="28" fill="#ffffff" stroke="#dbe7ff"/>
  <rect x="70" y="485" width="2660" height="350" rx="28" fill="#ffffff" stroke="#dbe7ff"/>
